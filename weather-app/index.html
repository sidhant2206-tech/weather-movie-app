<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>🌤️ Weather App</h1>

    <form id="search-form">
      <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <p id="message" class="message"></p>

    <section id="weather-result" class="weather-card hidden">
      <h2 id="city-name"></h2>
      <img id="weather-icon" alt="Weather icon">
      <p id="temperature" class="temp"></p>
      <p id="condition" class="condition"></p>
      <div class="details">
        <div><span>💧 Humidity</span><strong id="humidity"></strong></div>
        <div><span>💨 Wind</span><strong id="wind"></strong></div>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
